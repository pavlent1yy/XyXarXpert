<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забыли пароль - XXX XyXarXpert</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="main.css">
    <link rel="stylesheet" th:href="@{/css/pages/forgot-password.css}" href="forgot-password.css">
</head>
<body>
<div class="forgot-wrapper">
    <div class="forgot-container">
        <!-- Сообщения об ошибках -->
        <div class="form-message error-message" th:if="${error}" th:text="${error}"></div>
        <div class="form-message success-message" th:if="${message}" th:text="${message}"></div>

        <!-- Форма восстановления -->
        <div class="forgot-form">
            <h2>Забыли пароль?</h2>
            <p>Введите свой email, чтобы восстановить доступ</p>

            <form th:action="@{/auth/forgot-password}" method="post" id="forgotForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-input"
                                placeholder="your@email.com"
                                required
                        >
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Отправить ссылку</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="form-footer">
                <a href="/auth/login">← Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/forgot-password.js}" src="forgot-password.js"></script>
</body>
</html>
