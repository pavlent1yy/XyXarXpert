<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля - XXX XyXarXpert</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="main.css">
    <link rel="stylesheet" th:href="@{/css/pages/change-password.css}" href="change-password.css">
</head>
<body>
<!-- Header -->
<div th:replace="~{fragments/header.html}"></div>

<div class="change-wrapper">
    <div class="change-container">
        <div class="breadcrumb">
            <a href="/">Главная</a>
            <span class="separator">→</span>
            <a href="/profile">Профиль</a>
            <span class="separator">→</span>
            <span>Смена пароля</span>
        </div>

        <!-- Сообщения об ошибках -->
        <div class="form-message error-message" th:if="${error}" th:text="${error}"></div>
        <div class="form-message success-message" th:if="${message}" th:text="${message}"></div>

        <!-- Форма смены пароля -->
        <div class="change-form">
            <h2>Смена пароля</h2>
            <p>Обновите свой пароль для безопасности аккаунта</p>

            <form th:action="@{/profile/change-password}" method="post" id="changePasswordForm">
                <!-- Текущий пароль -->
                <div class="form-group">
                    <label for="currentPassword">Текущий пароль</label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="currentPassword"
                                name="currentPassword"
                                class="form-input"
                                placeholder="••••••••"
                                required
                        >
                        <button type="button" class="toggle-password" data-target="currentPassword">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- Новый пароль -->
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                class="form-input"
                                placeholder="••••••••"
                                required
                        >
                        <button type="button" class="toggle-password" data-target="newPassword">
                            👁️
                        </button>
                    </div>
                    <div class="password-requirements">
                        <div class="requirement" id="req-length">
                            <span class="requirement-icon">○</span>
                            <span>Минимум 8 символов</span>
                        </div>
                        <div class="requirement" id="req-uppercase">
                            <span class="requirement-icon">○</span>
                            <span>Заглавная буква</span>
                        </div>
                        <div class="requirement" id="req-number">
                            <span class="requirement-icon">○</span>
                            <span>Цифра</span>
                        </div>
                    </div>
                </div>

                <!-- Подтверждение пароля -->
                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="form-input"
                                placeholder="••••••••"
                                required
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Сменить пароль</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="form-footer">
                <a href="/profile">← Вернуться в профиль</a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer.html}"></div>

<script th:src="@{/js/menu.js}" src="menu.js"></script>
<script th:src="@{/js/change-password.js}" src="change-password.js"></script>
</body>
</html>
