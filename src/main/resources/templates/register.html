<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - XXX XyXarXpert</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="main.css">
    <link rel="stylesheet" th:href="@{/css/pages/register.css}" href="register.css">
</head>
<body>
<!-- Фон с анимацией -->
<div class="register-bg">
    <div class="bg-element bg-1"></div>
    <div class="bg-element bg-2"></div>
    <div class="bg-element bg-3"></div>
</div>

<!-- Контейнер регистрации -->
<div class="register-container">
    <!-- Левая часть - Форма регистрации -->
    <div class="register-form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <h2>Создай аккаунт</h2>
                <p>Присоединяйся к нам</p>
            </div>

            <!-- Ошибки валидации -->
            <div th:if="${param.error}" class="error-message">
                <span class="error-icon">⚠️</span>
                <span th:text="${param.error}"></span>
            </div>

            <form class="register-form" th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>
                <!-- Имя и Фамилия в одну строку -->
                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('firstName')} ? 'error'">
                        <label for="firstName">Имя</label>
                        <div class="input-wrapper">
                            <input
                                    type="text"
                                    id="firstName"
                                    name="firstName"
                                    class="form-input"
                                    placeholder="Иван"
                                    th:field="*{firstName}"
                                    required
                            >
                            <span class="input-icon">👤</span>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('firstName')}">
                            <span th:errors="*{firstName}"></span>
                        </div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('lastName')} ? 'error'">
                        <label for="lastName">Фамилия</label>
                        <div class="input-wrapper">
                            <input
                                    type="text"
                                    id="lastName"
                                    name="lastName"
                                    class="form-input"
                                    placeholder="Иванов"
                                    th:field="*{lastName}"
                                    required
                            >
                            <span class="input-icon">👤</span>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('lastName')}">
                            <span th:errors="*{lastName}"></span>
                        </div>
                    </div>
                </div>

                <!-- Отчество (опционально) -->
                <div class="form-group">
                    <label for="middleName">Отчество <span class="optional">(опционально)</span></label>
                    <div class="input-wrapper">
                        <input
                                type="text"
                                id="middleName"
                                name="middleName"
                                class="form-input"
                                placeholder="Иванович"
                                th:field="*{middleName}"
                        >
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'error'">
                    <label for="email">Электронная почта</label>
                    <div class="input-wrapper">
                        <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-input"
                                placeholder="example@mail.com"
                                th:field="*{email}"
                                required
                        >
                        <span class="input-icon">✉️</span>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}">
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <!-- Пароль и Подтверждение в одну строку -->
                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('password')} ? 'error'">
                        <label for="password">Пароль</label>
                        <div class="input-wrapper">
                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-input"
                                    placeholder="••••••••"
                                    th:field="*{password}"
                                    required
                            >
                            <button type="button" class="toggle-password" data-target="password">
                                👁️
                            </button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('password')}">
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'error'">
                        <label for="confirmPassword">Подтверди пароль</label>
                        <div class="input-wrapper">
                            <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    class="form-input"
                                    placeholder="••••••••"
                                    th:field="*{confirmPassword}"
                                    required
                            >
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                👁️
                            </button>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}">
                            <span th:errors="*{confirmPassword}"></span>
                        </div>
                    </div>
                </div>

                <!-- Согласие с условиями -->
                <div class="form-checkbox">
                    <label class="checkbox-custom">
                        <input type="checkbox" name="terms" required>
                        <span>Я согласен с <a href="#" class="terms-link">условиями использования</a></span>
                    </label>
                </div>

                <!-- Кнопка регистрации -->
                <button type="submit" class="btn-register">
                    <span>Зарегистрироваться</span>
                    <span class="btn-arrow">→</span>
                </button>

                <!-- Разделитель -->
                <div class="divider">
                    <span>или</span>
                </div>

                <!-- Социальная регистрация -->
                <div class="social-register">
                    <button type="button" class="social-btn google">
                        <span>G</span>
                    </button>
                    <button type="button" class="social-btn github">
                        <span>⚙️</span>
                    </button>
                    <button type="button" class="social-btn vk">
                        <span>VK</span>
                    </button>
                </div>
            </form>

            <!-- Вход -->
            <div class="form-footer">
                <p>Уже есть аккаунт? <a th:href="@{/auth/login}" class="signin-link">Войди</a></p>
            </div>
        </div>

        <!-- Декоративные элементы -->
        <div class="form-decoration">
            <div class="deco-circle deco-1"></div>
            <div class="deco-circle deco-2"></div>
        </div>
    </div>

    <!-- Правая часть - Брендинг -->
    <div class="register-branding">
        <div class="branding-content">
            <a href="/main" class="logo-small">XXX</a>

            <div class="vertical-text">
                <span class="register-word">R</span>
                <span class="register-word">E</span>
                <span class="register-word">G</span>
                <span class="register-word">I</span>
                <span class="register-word">S</span>
                <span class="register-word">T</span>
                <span class="register-word">R</span>
                <span class="register-word">A</span>
                <span class="register-word">T</span>
                <span class="register-word">I</span>
                <span class="register-word">O</span>
                <span class="register-word">N</span>
            </div>

        </div>

        <!-- Декоративные линии -->
        <div class="branding-decoration">
            <div class="deco-line deco-line-1"></div>
            <div class="deco-line deco-line-2"></div>
        </div>
    </div>
</div>

<!-- Линия снизу -->
<div class="register-footer">
    <a th:href="@{/main}" class="back-link">← На главную</a>
    <div class="footer-info">
        <span>© 2026 XXX</span>
        <span class="separator">•</span>
        <span>XyXarXpert</span>
    </div>
</div>

<script th:src="@{/js/register.js}" src="register.js"></script>
</body>
</html>
