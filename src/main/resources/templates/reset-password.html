<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - XXX XyXarXpert</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="main.css">
    <link rel="stylesheet" th:href="@{/css/pages/reset-password.css}" href="reset-password.css">
</head>
<body>
<div class="reset-wrapper">
    <div class="reset-container">
        <!-- Сообщения об ошибках -->
        <div class="form-message error-message" th:if="${error}" th:text="${error}"></div>
        <div class="form-message success-message" th:if="${message}" th:text="${message}"></div>

        <!-- Форма сброса пароля -->
        <div class="reset-form">
            <h2>Установить новый пароль</h2>
            <p>Придумайте надежный пароль для вашего аккаунта</p>

            <form th:action="@{/auth/reset-password}" method="post" id="resetForm">
                <!-- Hidden token -->
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label for="password">Новый пароль</label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="••••••••"
                                required
                        >
                        <button type="button" class="toggle-password" data-target="password">
                            👁️
                        </button>
                    </div>
                    <div class="password-requirements">
                        <div class="requirement" id="req-length">
                            <span class="requirement-icon">○</span>
                            <span>Минимум 8 символов</span>
                        </div>
                        <div class="requirement" id="req-uppercase">
                            <span class="requirement-icon">○</span>
                            <span>Заглавная буква</span>
                        </div>
                        <div class="requirement" id="req-number">
                            <span class="requirement-icon">○</span>
                            <span>Цифра</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <div class="input-wrapper">
                        <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="form-input"
                                placeholder="••••••••"
                                required
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Установить пароль</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="form-footer">
                <a href="/auth/login">← Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/reset-password.js}" src="reset-password.js"></script>
</body>
</html>
